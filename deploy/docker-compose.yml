    env_file:
      - ../.env
    environment:
      FINSIGHT_ENV: production
      FINSIGHT_REPOSITORY: postgresql
      FINSIGHT_DATABASE_URL: ${FINSIGHT_COMPOSE_DATABASE_URL:?Set FINSIGHT_COMPOSE_DATABASE_URL}
      FINSIGHT_REDIS_URL: redis://redis:6379/0
      FINSIGHT_JWT_SECRET: ${FINSIGHT_JWT_SECRET}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-bridge}
      MARKET_DATA_BRIDGE_URL: ${MARKET_DATA_BRIDGE_URL:-http://127.0.0.1:8765}
      FORECAST_OUTCOME_WORKER_INTERVAL_SECONDS: ${FORECAST_OUTCOME_WORKER_INTERVAL_SECONDS:-3600}
      FORECAST_OUTCOME_FLAT_BAND: ${FORECAST_OUTCOME_FLAT_BAND:-0.003}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import glob, os; assert any(b'app.worker' in open(path, 'rb').read() for path in glob.glob('/proc/[0-9]*/cmdline') if path != f'/proc/{os.getpid()}/cmdline')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
      POSTGRES_USER: ${POSTGRES_USER:-finsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  artifacts:
  market-data:
  postgres-data:
  redis-data:
