[project]
name = "finsight-agent"
version = "0.1.0"
description = "Evidence-first financial event research system"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.14,<2",
  "apscheduler>=3.10,<4",
  "feedparser>=6.0,<7",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "pydantic>=2.9,<3",
  "PyJWT>=2.9,<3",
  "PyMuPDF>=1.24,<2",
  "pwdlib[argon2]>=0.2,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "cryptography>=47.0.0",
  "clickhouse-connect>=1.6,<2; python_version >= '3.10' and python_version < '3.15'",
  "exchange-calendars>=4.13,<5; python_version >= '3.10'",
  "pgvector>=0.4.2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
postgres = [
  "langgraph-checkpoint-postgres>=2,<4",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<6",
]
market = [
  "akshare>=1.18,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"app/admin_ui.py" = ["E501"]
